<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offerte Tirocini &middot; UniBo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <h1>Offerte Tirocini</h1>
            <span class="brand-sub">UniBo &middot; Bologna</span>
        </div>
        <div class="search">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm0-2a8 8 0 1 0 4.9 14.32l4.4 4.39 1.4-1.42-4.38-4.38A8 8 0 0 0 10 2z"/></svg>
            <input type="search" id="search" placeholder="Cerca azienda, descrizione, attività, comune…" autocomplete="off" spellcheck="false">
        </div>
    </header>

    <div class="warning-banner">
        Le offerte vengono aggiornate ogni 24 ore, ricontrolla sempre l'offerta sul sito ufficiale
    </div>

    <div class="type-tabs" id="type-tabs" role="tablist">
        <button type="button" class="type-tab" data-type="extracurricular" role="tab">Candidatura autonoma</button>
        <button type="button" class="type-tab" data-type="curricular" role="tab">Curriculari</button>
    </div>

    <div class="layout">
        <main class="results">
            <div class="results-head">
                <span id="count" class="count"></span>

                <button type="button" id="mobile-filters-btn" class="action">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg> Filtri
                </button>

                <div class="filter-bar" id="filter-bar">
                    <select id="sort" class="filter-select" aria-label="Ordina per"></select>
                    <select id="category" class="filter-select category-select" aria-label="Categoria"></select>
                    <select id="comune" class="filter-select comune-select" aria-label="Comune"></select>

                    <label class="toggle-switch-label">
                        <div class="toggle-switch">
                            <input type="checkbox" id="only-bookmarks">
                            <span class="slider"></span>
                        </div>
                        Solo preferiti
                    </label>

                    <button type="button" id="clear-filters" class="link-btn">Azzera filtri</button>
                </div>
                <button type="button" id="download-json" class="action download-btn">Download JSON</button>
            </div>
            <div class="card-grid" id="card-grid"></div>
            <p class="notice" id="notice" hidden></p>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
