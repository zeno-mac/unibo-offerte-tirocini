name: Scrape and refresh offers
run-name: "Scrape and refresh offers #${{ github.run_number }}"

on:
  workflow_dispatch:
  schedule:
    - cron: "42 22 * * *"  


permissions:
  contents: write
  pull-requests: write

jobs:
  scrape-pr:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Create. .env
      run: echo "${{secrets.ENV }}" > .env
    - name: Install dependencies
      run: python -m pip install --requirement requirements.txt
    - name: Run test
      run: python scraper/main.py
    - name: Check differences
      id: diff
      run: python scraper/file_checker.py
    - name: Open / update PR
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.GH_PAT}}
        add-paths: files/log.json,files/log.csv
        branch: data/refresh
        title: "data: refresh offers #${{ github.run_number }}"
        body: |
          Automated scrape. Change summary:
            ```
            ${{ steps.diff.outputs.summary }}
            ```
        commit-message: |
          data: refresh offers #${{ github.run_number }}

          Automated scrape. Change summary:
          ${{ steps.diff.outputs.summary }}
